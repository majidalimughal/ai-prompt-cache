name: Bug Report
description: Report a bug in ai-prompt-cache
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Install ai-prompt-cache
        2. Configure MemoryStore
        3. Call ai.chat()
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js Version
      placeholder: e.g. 20.11.0
    validations:
      required: true
  - type: dropdown
    id: cache-store
    attributes:
      label: Cache Store
      options:
        - Memory
        - Redis
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      options:
        - OpenAI
        - Other
    validations:
      required: true
